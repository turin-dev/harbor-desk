name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, build, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build and type-check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Check npm package contents
        run: npm pack --dry-run

  docker-live-smoke:
    name: Live Docker smokes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and type-check
        run: pnpm run check
      - name: Configure smoke endpoint
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "SMOKE_ENDPOINT=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
          else
            echo "SMOKE_ENDPOINT=npipe:////./pipe/docker_engine" >> "$GITHUB_ENV"
          fi
      # windows-latest (image windows-2025) sometimes reaches this job with
      # the Docker service stopped, so \\.\pipe\docker_engine never appears.
      # The engine smoke already waits five minutes, and that wait cannot
      # create the pipe. Start the service first. A runner that has no
      # docker service still fails here, with the service state in the log.
      - name: Start Docker Engine on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name 'docker' -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Error 'The docker service is not installed on this runner.'
            exit 1
          }
          if ($service.Status -ne 'Running') {
            Start-Service -Name 'docker'
          }
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path '\\.\pipe\docker_engine') -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path '\\.\pipe\docker_engine')) {
            Get-Service -Name 'docker' | Format-List *
            docker version
            Write-Error 'Named pipe \\.\pipe\docker_engine did not appear after starting the docker service.'
            exit 1
          }
          docker version
      - name: Run Engine smoke
        run: pnpm run smoke:engine
      - name: Run full-stack gateway smoke
        run: pnpm run smoke:live

      - name: Run Electron click-through smoke
        run: pnpm run smoke:click

  supply-chain:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
