name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build and type-check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag || github.ref_name }}"

          # A tag that disagrees with the manifest would publish mislabeled
          # artifacts, so fail before anything is built.
          if [ "v${version}" != "${tag}" ]; then
            echo "Tag ${tag} does not match package version v${version}." >&2
            exit 1
          fi

          echo "version=${version}" >>"$GITHUB_OUTPUT"

  client:
    name: Build client (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            artifact: client-linux
          - os: windows-latest
            script: package:win
            artifact: client-windows
          - os: macos-15-intel
            script: package:mac
            artifact: client-macos-x64
          - os: macos-latest
            script: package:mac
            artifact: client-macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop client
        # The artifacts are unsigned unless the build environment supplies signing
        # material. The publish job attaches them as a clearly marked preview.
        # Use the root script so pnpm builds the workspace packages the renderer
        # imports before electron-builder runs.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run ${{ matrix.script }}

      - name: Collect distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap

  server:
    name: Build server payload
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm_release_version: ${{ steps.npm_registry.outputs.release_version }}
      npm_latest_version: ${{ steps.npm_registry.outputs.latest_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the gateway container image
        # Proves the server payload actually builds on a clean host before the
        # release claims Linux, Windows, and macOS server support.
        run: docker build -f infra/compose/Dockerfile.gateway -t harbor-desk-gateway:${{ needs.verify.outputs.version }} .

      - name: Pack the npm server installer
        run: npm pack

      - name: Inspect npm registry distribution
        id: npm_registry
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          release_version="$(npm view "harbor-desk@${version}" version --silent 2>/dev/null || true)"
          latest_version="$(npm view harbor-desk version --silent 2>/dev/null || true)"

          echo "release_version=${release_version}" >>"$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >>"$GITHUB_OUTPUT"

      - name: Collect the npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: server-npm-package
          if-no-files-found: error
          retention-days: 14
          path: harbor-desk-*.tgz

  publish:
    name: Publish GitHub release
    needs: [verify, client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download client artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true

      - name: Download server package
        uses: actions/download-artifact@v8
        with:
          name: server-npm-package
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS

      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_RELEASE_VERSION: ${{ needs.server.outputs.npm_release_version }}
          NPM_LATEST_VERSION: ${{ needs.server.outputs.npm_latest_version }}
        run: node scripts/generate-release-notes.mjs > release-notes.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harbor Desk $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harbor Desk $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease \
              --verify-tag
          fi
