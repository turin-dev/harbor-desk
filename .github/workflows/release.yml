name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build and type-check
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ inputs.tag || github.ref_name }}"

          # A tag that disagrees with the manifest would publish mislabeled
          # artifacts, so fail before anything is built.
          if [ "v${version}" != "${tag}" ]; then
            echo "Tag ${tag} does not match package version v${version}." >&2
            exit 1
          fi

          echo "version=${version}" >>"$GITHUB_OUTPUT"

  client:
    name: Build client (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            artifact: client-linux
          - os: windows-latest
            script: package:win
            artifact: client-windows
          - os: macos-15-intel
            script: package:mac
            artifact: client-macos-x64
          - os: macos-latest
            script: package:mac
            artifact: client-macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop client
        # The artifacts are unsigned unless the build environment supplies signing
        # material. The publish job attaches them as a clearly marked preview.
        # Use the root script so pnpm builds the workspace packages the renderer
        # imports before electron-builder runs.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run ${{ matrix.script }}

      - name: Collect distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap

  server:
    name: Build server payload
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm_release_version: ${{ steps.npm_registry.outputs.release_version }}
      npm_latest_version: ${{ steps.npm_registry.outputs.latest_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the gateway container image
        # Proves the server payload actually builds on a clean host before the
        # release claims Linux, Windows, and macOS server support.
        run: docker build -f infra/compose/Dockerfile.gateway -t harbor-desk-gateway:${{ needs.verify.outputs.version }} .

      - name: Pack the npm server installer
        run: npm pack

      - name: Inspect npm registry distribution
        id: npm_registry
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          release_version="$(npm view "harbor-desk@${version}" version --silent 2>/dev/null || true)"
          latest_version="$(npm view harbor-desk version --silent 2>/dev/null || true)"

          echo "release_version=${release_version}" >>"$GITHUB_OUTPUT"
          echo "latest_version=${latest_version}" >>"$GITHUB_OUTPUT"

      - name: Collect the npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: server-npm-package
          if-no-files-found: error
          retention-days: 14
          path: harbor-desk-*.tgz

  publish-npm:
    name: Publish npm package
    needs: [verify, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      release_version: ${{ steps.inspect.outputs.release_version }}
      latest_version: ${{ steps.inspect.outputs.latest_version }}
      preview_version: ${{ steps.inspect.outputs.preview_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm Trusted Publishing client
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for Trusted Publishing; npm 11.5.1 or newer is required.`);
              process.exit(1);
            }
          ' "${npm_version}"
          echo "npm ${npm_version}"

      - name: Download the exact server package
        uses: actions/download-artifact@v8
        with:
          name: server-npm-package
          path: release-assets

      - name: Publish the exact tagged package without overwrite
        id: publish
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version v${version}." >&2
            exit 1
          fi

          manifest_version="$(node -p "require('./package.json').version")"
          if [ "${manifest_version}" != "${version}" ]; then
            echo "Root package version ${manifest_version} does not match ${version}." >&2
            exit 1
          fi

          tarball="release-assets/harbor-desk-${version}.tgz"
          if [ ! -f "${tarball}" ]; then
            echo "Expected package ${tarball} was not downloaded." >&2
            exit 1
          fi

          tarball_version="$(tar -xOf "${tarball}" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));
          ')"
          if [ "${tarball_version}" != "${version}" ]; then
            echo "Tarball version ${tarball_version} does not match ${version}." >&2
            exit 1
          fi

          existing_error="$(mktemp)"
          if existing_version="$(npm view "harbor-desk@${version}" version --json 2>"${existing_error}")"; then
            existing_version="$(printf '%s' "${existing_version}" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => process.stdout.write(String(JSON.parse(input))));
            ')"
            if [ "${existing_version}" != "${version}" ]; then
              echo "npm returned unexpected existing version ${existing_version}." >&2
              exit 1
            fi
            echo "${version} is already published; refusing to overwrite it."
          else
            if ! grep -q 'E404' "${existing_error}"; then
              cat "${existing_error}" >&2
              exit 1
            fi
            npm publish "./${tarball}" --access public --tag preview --provenance
          fi

      - name: Verify npm publication and dist-tags
        id: inspect
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          json_value() {
            node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(input);
                process.stdout.write(typeof value === "string" ? value : JSON.stringify(value));
              });
            '
          }

          version="${RELEASE_VERSION}"
          metadata="$(npm view "harbor-desk@${version}" version repository dist.integrity --json)"
          published_version="$(npm view "harbor-desk@${version}" version --json | json_value)"
          repository_url="$(npm view "harbor-desk@${version}" repository.url --json | json_value)"
          integrity="$(npm view "harbor-desk@${version}" dist.integrity --json | json_value)"
          preview_version="$(npm view harbor-desk dist-tags.preview --json | json_value)"
          latest_version="$(npm view harbor-desk version --json | json_value)"

          if [ "${published_version}" != "${version}" ] || [ -z "${integrity}" ]; then
            echo "npm metadata did not confirm the published version or integrity." >&2
            echo "${metadata}" >&2
            exit 1
          fi
          if [[ "${repository_url}" != *"turin-dev/harbor-desk"* ]]; then
            echo "npm repository metadata is not for turin-dev/harbor-desk: ${repository_url}" >&2
            exit 1
          fi
          if [ "${preview_version}" != "${version}" ]; then
            echo "npm preview dist-tag points to ${preview_version}, expected ${version}." >&2
            exit 1
          fi

          {
            echo "release_version=${published_version}"
            echo "latest_version=${latest_version}"
            echo "preview_version=${preview_version}"
          } >>"${GITHUB_OUTPUT}"

  publish:
    name: Publish GitHub release
    needs: [verify, client, server, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download client artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true

      - name: Download server package
        uses: actions/download-artifact@v8
        with:
          name: server-npm-package
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_RELEASE_VERSION: ${{ needs.publish-npm.outputs.release_version }}
          NPM_LATEST_VERSION: ${{ needs.publish-npm.outputs.latest_version }}
          NPM_PREVIEW_VERSION: ${{ needs.publish-npm.outputs.preview_version }}
        run: node scripts/generate-release-notes.mjs > release-notes.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harbor Desk $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harbor Desk $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease \
              --verify-tag
          fi
