packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
# Dependabot security updates only bump direct dependencies
# (allowed-updates: dependency-type direct, update-subdependencies false).
# These packages stay on vulnerable lockfile pins because the parent is
# already current and its range still admits the vulnerable release:
#   joi 18.2.5 via wait-on (needs >=18.3.1)
#   undici 6.28.0 via node-gyp (needs >=6.29.1)
#   fast-uri 3.1.6 via ajv and 4.1.3 via fast-json-stringify (needs >=3.1.9 and >=4.2.3)
# The other selectors are the same class of transitive advisory, kept on the
# patched release of the same major line.
overrides:
  "joi@<18.3.1": "18.3.2"
  "undici@>=6 <6.29.1": "6.29.1"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  "fast-uri@>=4 <4.2.3": "4.2.3"
  "axios@<1.21.1": "1.21.1"
  "follow-redirects@<1.16.3": "1.16.3"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "shell-quote@<1.11.0": "1.12.0"
  "brace-expansion@>=1 <2": "1.1.22"
  "brace-expansion@>=2 <3": "2.1.8"
  "brace-expansion@>=5 <6": "5.0.13"
  "source-map-js@<1.2.2": "1.2.2"
