openapi: 3.1.0
info:
  title: Harbor Desk Gateway API
  version: 0.1.0
  description: Remote-first container operations API. Docker Engine credentials remain server-side.
servers:
  - url: https://gateway.example.com
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      responses:
        "200":
          description: Gateway liveness
  /api/v1/auth/providers:
    get:
      security: []
      responses:
        "200":
          description: Configured OIDC providers
  /api/v1/auth/authorize/{providerId}:
    get:
      security: []
      parameters:
        - $ref: "#/components/parameters/providerId"
        - {
            name: redirectUri,
            in: query,
            required: true,
            schema: { type: string },
          }
        - {
            name: state,
            in: query,
            required: true,
            schema: { type: string, minLength: 16 },
          }
        - {
            name: nonce,
            in: query,
            required: true,
            schema: { type: string, minLength: 16 },
          }
        - {
            name: codeChallenge,
            in: query,
            required: true,
            schema: { type: string, minLength: 43 },
          }
      responses:
        "302":
          description: Redirect to the selected OIDC provider
  /api/v1/auth/token:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, redirectUri]
              properties:
                providerId: { type: string }
                code: { type: string }
                codeVerifier: { type: string }
                nonce: { type: string }
                refreshToken: { type: string }
                redirectUri:
                  { type: string, enum: [harbor-desk://auth/callback] }
      responses:
        "200":
          description: Short-lived access token and optional rotated refresh token
  /api/v1/auth/ws-ticket:
    post:
      responses:
        "201":
          description: One-time WebSocket ticket
  /api/v1/me:
    get:
      responses:
        "200":
          description: Current user
  /api/v1/permissions:
    get:
      responses:
        "200":
          description: Current permissions
  /api/v1/hosts:
    get:
      responses:
        "200":
          description: Visible remote hosts
    post:
      responses:
        "201":
          description: Registered remote host
  /api/v1/hosts/{hostId}:
    delete:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "204":
          description: Removed remote host (admin role required)
  /api/v1/hosts/{hostId}/test:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Re-probed host status (admin role required)
  /api/v1/hosts/{hostId}/capabilities:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Host capability matrix
  /api/v1/hosts/{hostId}/dashboard:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Host dashboard summary
  /api/v1/hosts/{hostId}/containers:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Remote containers
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreateInput"
      responses:
        "202":
          description: Container create and start operation
  /api/v1/hosts/{hostId}/containers/{containerId}/{action}:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, restart, pause, unpause, kill]
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "202":
          description: Container lifecycle operation (operator or admin role required)
  /api/v1/hosts/{hostId}/containers/{containerId}:
    delete:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
        - $ref: "#/components/parameters/idempotencyKey"
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "202":
          description: Container deletion operation (operator or admin role required)
  /api/v1/hosts/{hostId}/prune/{kind}:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [containers, images, volumes, networks]
        - { name: all, in: query, schema: { type: boolean, default: false } }
      responses:
        "202":
          description: Resource prune operation (operator or admin role required)
  /api/v1/hosts/{hostId}/containers/{containerId}/inspect:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
      responses:
        "200":
          description: Sanitized container inspect payload
  /api/v1/hosts/{hostId}/containers/{containerId}/logs:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
        - { name: tail, in: query, schema: { type: string, default: "200" } }
      responses:
        "200":
          description: Recent container logs
  /api/v1/hosts/{hostId}/containers/{containerId}/stats:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
      responses:
        "200":
          description: One container stats snapshot
  /api/v1/hosts/{hostId}/containers/{containerId}/exec:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/containerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, maxLength: 4096 }
      responses:
        "201":
          description: Terminal session created
  /api/v1/hosts/{hostId}/images:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Remote images
  /api/v1/hosts/{hostId}/builds/context:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
        - {
            name: operation-id,
            in: header,
            schema: { type: string, maxLength: 128 },
            description: Client-generated operation id used to track build progress via the operations endpoint.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageBuildInput"
      responses:
        "202":
          description: Image build operation
  /api/v1/hosts/{hostId}/images/pull:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
        - {
            name: operation-id,
            in: header,
            schema: { type: string, maxLength: 128 },
            description: Client-generated operation id used to track pull progress via the operations endpoint.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePullInput"
      responses:
        "202":
          description: Image pull operation
  /api/v1/hosts/{hostId}/images/scan:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
        - {
            name: operation-id,
            in: header,
            schema: { type: string, maxLength: 128 },
            description: Client-generated operation id used to track scan progress via the operations endpoint.,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageScanInput"
      responses:
        "202":
          description: Image scan operation
  /api/v1/hosts/{hostId}/images/scans/{operationId}:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - {
            name: operationId,
            in: path,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        "200":
          description: Vulnerability scan report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageScanReport"
  /api/v1/hosts/{hostId}/images/{imageId}/inspect:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/imageId"
      responses:
        "200":
          description: Remote image inspect payload
  /api/v1/hosts/{hostId}/images/{imageId}:
    delete:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/imageId"
        - $ref: "#/components/parameters/idempotencyKey"
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "202":
          description: Image deletion operation
  /api/v1/hub/search:
    get:
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 25 },
          }
      responses:
        "200":
          description: Docker Hub search results
  /api/v1/hosts/{hostId}/volumes:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Remote volumes
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeCreateInput"
      responses:
        "202":
          description: Volume creation operation
  /api/v1/hosts/{hostId}/volumes/{volumeName}/inspect:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/volumeName"
      responses:
        "200":
          description: Remote volume inspect payload
  /api/v1/hosts/{hostId}/volumes/{volumeName}/browse:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/volumeName"
        - { name: path, in: query, schema: { type: string, default: "/" } }
        - { name: image, in: query, schema: { type: string } }
      responses:
        "200":
          description: Remote volume file listing
  /api/v1/hosts/{hostId}/volumes/{volumeName}:
    delete:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/volumeName"
        - $ref: "#/components/parameters/idempotencyKey"
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "202":
          description: Volume deletion operation
  /api/v1/hosts/{hostId}/networks:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
      responses:
        "200":
          description: Remote networks
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreateInput"
      responses:
        "202":
          description: Network creation operation
  /api/v1/hosts/{hostId}/networks/{networkId}/inspect:
    get:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/networkId"
      responses:
        "200":
          description: Remote network inspect payload
  /api/v1/hosts/{hostId}/networks/{networkId}:
    delete:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/networkId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "202":
          description: Network deletion operation
  /api/v1/hosts/{hostId}/networks/{networkId}/connect:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/networkId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkAttachInput"
      responses:
        "202":
          description: Network attach operation
  /api/v1/hosts/{hostId}/networks/{networkId}/disconnect:
    post:
      parameters:
        - $ref: "#/components/parameters/hostId"
        - $ref: "#/components/parameters/networkId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkAttachInput"
      responses:
        "202":
          description: Network detach operation
  /api/v1/stream:
    get:
      description: WebSocket upgrade endpoint for host events and operation progress.
      responses:
        "101":
          description: Switching protocols
  /api/v1/operations/{operationId}:
    get:
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: Operation state
  /api/v1/operations/{operationId}/cancel:
    post:
      description: >-
        Cancels a queued or running operation. A running operation aborts the
        in-flight Engine request, so image pulls, prune, and container, image,
        volume, and network mutations are cancelled server-side.
      parameters:
        - $ref: "#/components/parameters/operationId"
      responses:
        "200":
          description: Cancelled or already terminal operation
        "404":
          description: Operation not found
        "409":
          description: Operation cannot be cancelled in its current state
  /api/v1/audit:
    get:
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: Administrator audit metadata
  /api/v1/terminal/{sessionId}:
    get:
      description: WebSocket upgrade endpoint for container exec output and resize frames.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "101":
          description: Switching protocols
components:
  parameters:
    hostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
    containerId:
      name: containerId
      in: path
      required: true
      schema:
        type: string
    imageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
    volumeName:
      name: volumeName
      in: path
      required: true
      schema:
        type: string
    networkId:
      name: networkId
      in: path
      required: true
      schema:
        type: string
    providerId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
    operationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
  schemas:
    ApiProblem:
      type: object
      required: [code, message, retryable, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiProblem"
    Operation:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string }
        hostId: { type: string }
        kind: { type: string }
        status:
          {
            type: string,
            enum: [queued, running, succeeded, failed, cancelled],
          }
        progress: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        error: { $ref: "#/components/schemas/ApiProblem" }
    TerminalSession:
      type: object
      required: [id, hostId, containerId, createdAt, status]
      properties:
        id: { type: string }
        hostId: { type: string }
        containerId: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [created, running, closed] }
    ContainerCreateInput:
      type: object
      required: [image]
      properties:
        image: { type: string, minLength: 1, maxLength: 512 }
        name: { type: string, minLength: 1, maxLength: 255 }
        command: { type: string, maxLength: 4096 }
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortMapping"
        env:
          type: array
          items:
            $ref: "#/components/schemas/EnvVar"
        restartPolicy:
          type: string
          enum: [no, always, on-failure, unless-stopped]
        labels:
          type: object
          additionalProperties: { type: string }
    PortMapping:
      type: object
      required: [containerPort]
      properties:
        containerPort: { type: integer, minimum: 1, maximum: 65535 }
        hostPort: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [tcp, udp], default: tcp }
    EnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, maxLength: 4096 }
    PruneSummary:
      type: object
      properties:
        freedBytes: { type: integer, minimum: 0 }
        containersDeleted:
          type: array
          items: { type: string }
        imagesDeleted:
          type: array
          items:
            type: object
            properties:
              Digest: { type: string }
              Untagged: { type: string }
              Deleted: { type: string }
        volumesDeleted:
          type: array
          items: { type: string }
        networksDeleted:
          type: array
          items: { type: string }
    ImagePullInput:
      type: object
      required: [image]
      properties:
        image: { type: string, minLength: 1, maxLength: 512 }
    ImageScanInput:
      type: object
      required: [image]
      properties:
        image: { type: string, minLength: 1, maxLength: 512 }
        scannerImage: { type: string, minLength: 1, maxLength: 512 }
        severities: { type: string, minLength: 1, maxLength: 64 }
    ImageScanReport:
      type: object
      required:
        [
          image,
          scannerImage,
          startedAt,
          finishedAt,
          totalVulnerabilities,
          counts,
          partial,
          vulnerabilities,
        ]
      properties:
        image: { type: string }
        imageId: { type: string }
        scannerImage: { type: string }
        startedAt: { type: string }
        finishedAt: { type: string }
        totalVulnerabilities: { type: integer, minimum: 0 }
        counts:
          type: object
          required: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
          properties:
            CRITICAL: { type: integer, minimum: 0 }
            HIGH: { type: integer, minimum: 0 }
            MEDIUM: { type: integer, minimum: 0 }
            LOW: { type: integer, minimum: 0 }
            UNKNOWN: { type: integer, minimum: 0 }
        partial: { type: boolean }
        vulnerabilities:
          type: array
          items:
            $ref: "#/components/schemas/ImageScanVulnerability"
    ImageScanVulnerability:
      type: object
      required: [vulnerabilityId, severity]
      properties:
        vulnerabilityId: { type: string }
        package: { type: string }
        installedVersion: { type: string }
        fixedVersion: { type: string }
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        title: { type: string }
        description: { type: string }
    ImageBuildInput:
      type: object
      required: [contextTar, tag]
      properties:
        contextTar:
          type: string
          minLength: 1
          maxLength: 200000000
          description: Base64-encoded tar archive of the local build context
        tag: { type: string, minLength: 1, maxLength: 512 }
        dockerfile: { type: string, maxLength: 255 }
        buildArgs:
          type: object
          additionalProperties: { type: string, maxLength: 255 }
          maxProperties: 64
          propertyNames:
            {
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$",
              minLength: 1,
              maxLength: 255,
            }
    VolumeCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        driver: { type: string, minLength: 1, maxLength: 128 }
    VolumeBrowseEntry:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, directory] }
        sizeBytes: { type: integer, minimum: 0 }
        modifiedAt: { type: string }
    VolumeBrowseResult:
      type: object
      required: [volume, path, entries]
      properties:
        volume: { type: string }
        path: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/VolumeBrowseEntry"
    NetworkCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        driver: { type: string, minLength: 1, maxLength: 128 }
        internal: { type: boolean, default: false }
    NetworkAttachInput:
      type: object
      required: [containerId]
      properties:
        containerId: { type: string, minLength: 1, maxLength: 256 }
        ipamConfig: { type: object, additionalProperties: true }
    CapabilityMatrix:
      type: object
      required:
        [
          containers,
          images,
          volumes,
          networks,
          logs,
          stats,
          exec,
          compose,
          buildkit,
          kubernetes,
          extensions,
          imageScan,
          volumeFileBrowser,
        ]
      properties:
        containers: { type: boolean }
        images: { type: boolean }
        volumes: { type: boolean }
        networks: { type: boolean }
        logs: { type: boolean }
        stats: { type: boolean }
        exec: { type: boolean }
        compose: { type: boolean }
        buildkit: { type: boolean }
        kubernetes: { type: boolean }
        extensions: { type: boolean }
        imageScan: { type: boolean }
        volumeFileBrowser: { type: boolean }
    HubSearchResult:
      type: object
      required: [repository, starCount, pullCount, isOfficial]
      properties:
        repository: { type: string }
        description: { type: string }
        starCount: { type: integer, minimum: 0 }
        pullCount: { type: integer, minimum: 0 }
        isOfficial: { type: boolean }
    HubSearchResponse:
      type: object
      required: [query, resultCount, results]
      properties:
        query: { type: string }
        resultCount: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            $ref: "#/components/schemas/HubSearchResult"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
