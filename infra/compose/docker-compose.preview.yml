services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.gateway
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      AUTH_MODE: dev
      HOST: 0.0.0.0
      PORT: 4310
      GATEWAY_VERSION: ${GATEWAY_VERSION:-0.1.0-preview}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?Set a unique preview secret in .env.preview}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ENGINE_ENDPOINT_ALLOWLIST: ${ENGINE_ENDPOINT_ALLOWLIST:-}
    ports:
      - "127.0.0.1:${HARBOR_GATEWAY_PORT:-4311}:4310"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4310/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
